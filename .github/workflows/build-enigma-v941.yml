name: Build Enigma V9.4.1

on:
  push:
    branches:
      - enigma-v9-3-window-narrative
    paths:
      - .github/workflows/build-enigma-v941.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enigma-v9-3-window-narrative
          fetch-depth: 0

      - name: Create corrected full Pine strategy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_4_0_Window_Narrative_Recovery.pine')
          target = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_4_1_Sequenced_Judas_Delivery_Hold.pine')
          workflow = Path('.github/workflows/build-enigma-v941.yml')
          text = source.read_text(encoding='utf-8')

          text = text.replace(
              '"PO3 MMXM Enigma V9.4.0 Window Narrative Recovery",\n    shorttitle = "PO3E940N",',
              '"PO3 MMXM Enigma V9.4.1 Sequenced Judas Delivery Hold",\n    shorttitle = "PO3E941H",'
          )

          text = text.replace(
              'bool deliveryUsesFixedTarget = input.bool(true, "Delivery Uses Fixed Target", group = G_RISK)',
              'bool deliveryUsesFixedTarget = input.bool(false, "Delivery Uses Fixed Target", group = G_RISK)',
              1
          )

          old_vars = '''var recoveryFoundation = market.newStructure()
          var recoverySupport = market.newStructure()
          var int recoveryFoundationConfirmBar = na
          var int recoverySupportConfirmBar = na'''
          new_vars = '''var recoveryFoundation = market.newStructure()
          var recoverySupport = market.newStructure()
          var int recoveryFoundationConfirmBar = na
          var int recoverySupportConfirmBar = na

          // Judas uses the same causal sequence as delivery. An OB/BOLO alone or
          // an IMB alone can never open a counter-Session-FPI trade.
          var judasFoundation = market.newStructure()
          var judasSupport = market.newStructure()
          var int judasFoundationConfirmBar = na
          var int judasSupportConfirmBar = na
          var bool judasWindowResolved = false'''
          if old_vars not in text:
              raise RuntimeError('narrative variable anchor not found')
          text = text.replace(old_vars, new_vars, 1)

          old_reset = '''    recoveryFoundation := market.newStructure()
              recoverySupport := market.newStructure()
              recoveryFoundationConfirmBar := na
              recoverySupportConfirmBar := na
              if drawWindowDividers and currentWindow >= 0'''
          new_reset = '''    recoveryFoundation := market.newStructure()
              recoverySupport := market.newStructure()
              recoveryFoundationConfirmBar := na
              recoverySupportConfirmBar := na
              judasFoundation := market.newStructure()
              judasSupport := market.newStructure()
              judasFoundationConfirmBar := na
              judasSupportConfirmBar := na
              judasWindowResolved := false
              if drawWindowDividers and currentWindow >= 0'''
          if old_reset not in text:
              raise RuntimeError('window reset anchor not found')
          text = text.replace(old_reset, new_reset, 1)

          text = text.replace('judasFoundationSignal = market.newSignal()\n\n', '', 1)

          old_direct_ob = '''        if phase == PHASE_JUDAS and fpiEvent.direction == judasDirection and acceptedFoundation
                      judasFoundationSignal := market.signalFromStructure(targetFoundation, market.FAMILY_PRIMARY_OB, true, false, fpiEvent.direction == market.DIR_LONG ? "JUDAS-OB-BUY" : "JUDAS-OB-SELL", "JUDAS_FOUNDATION_CONFIRMED")
          '''
          if old_direct_ob not in text:
              raise RuntimeError('direct Judas OB entry anchor not found')
          text = text.replace(old_direct_ob, '', 1)

          old_judas_block = '''// A confirmed current-window IMB in Judas direction can enter the temporary
          // move, but it cannot end the campaign. Only recoverySignal performs handoff.
          judasImbSignal = market.newSignal()
          if phase == PHASE_JUDAS and currentWindow >= 0
              judasImb = judasDirection == market.DIR_LONG ? bullImbCandidate : bearImbCandidate
              if judasImb.active and bar_index > nz(judasImb.breakBar, bar_index)
                  bool judasTouch = market.overlaps(judasImb.top, judasImb.bottom, high, low)
                  if judasTouch
                      judasImb.touching := true
                  bool judasOutside = judasDirection == market.DIR_LONG ? close > judasImb.top : close < judasImb.bottom
                  bool judasCandle = not requireDirectionalCandle or judasDirection == market.DIR_LONG ? close > open : close < open
                  if judasImb.touching and judasOutside and judasCandle
                      judasImbSignal := market.signalFromStructure(judasImb, market.FAMILY_IMB_RETEST, true, false, judasDirection == market.DIR_LONG ? "JUDAS-IMB-BUY" : "JUDAS-IMB-SELL", "JUDAS_IMB_RETEST")
          '''
          if old_judas_block not in text:
              raise RuntimeError('standalone Judas IMB block anchor not found')
          text = text.replace(old_judas_block, '', 1)

          selection_anchor = '''// =============================================================================
          // Signal selection
          // =============================================================================
          selectedSignal = market.newSignal()
          if recoverySignal.valid
              selectedSignal := market.copySignal(recoverySignal)
          else if phase == PHASE_JUDAS and judasFoundationSignal.valid
              selectedSignal := market.copySignal(judasFoundationSignal)
          else if phase == PHASE_JUDAS and judasImbSignal.valid
              selectedSignal := market.copySignal(judasImbSignal)'''

          replacement = '''// =============================================================================
          // Sequenced Judas narrative: current-window OB/BOLO -> bound IMB ->
          // later retest and directional close. No standalone sell/buy signals.
          // =============================================================================
          judasSequenceSignal = market.newSignal()
          if phase == PHASE_JUDAS and enableJudasTrades and currentWindow >= 0 and judasDirection != market.DIR_NONE and not judasWindowResolved
              alignedJudasFoundation = judasDirection == market.DIR_LONG ? bullFoundationCandidate : bearFoundationCandidate

              if alignedJudasFoundation.active and alignedJudasFoundation.status == market.STATUS_CONFIRMED
                  bool replaceJudasFoundation = not judasFoundation.active or moreExtreme(alignedJudasFoundation.top, alignedJudasFoundation.bottom, judasFoundation.top, judasFoundation.bottom, judasDirection)
                  if replaceJudasFoundation
                      copyStructure(judasFoundation, alignedJudasFoundation)
                      judasFoundation.direction := judasDirection
                      judasFoundation.family := market.FAMILY_PRIMARY_OB
                      judasFoundation.status := market.STATUS_CONFIRMED
                      judasFoundationConfirmBar := alignedJudasFoundation.confirmBar
                      judasSupport := market.newStructure()
                      judasSupportConfirmBar := na

              if judasFoundation.active
                  alignedJudasImb = judasDirection == market.DIR_LONG ? bullImbCandidate : bearImbCandidate
                  opposingJudasImb = judasDirection == market.DIR_LONG ? bearImbCandidate : bullImbCandidate
                  if allowAlignedImb
                      bindImbCandidate(judasSupport, alignedJudasImb, judasFoundation, judasDirection, currentWindow)
                  if allowOpposingImbReclaim
                      bindImbCandidate(judasSupport, opposingJudasImb, judasFoundation, judasDirection, currentWindow)

                  bool judasFoundationFailed = foundationBodyInvalid(judasFoundation, judasDirection)
                  if judasFoundationFailed
                      judasFoundation := market.newStructure()
                      judasSupport := market.newStructure()
                      judasFoundationConfirmBar := na
                      judasSupportConfirmBar := na
                  else if judasSupport.active
                      int judasEligibleAfter = int(math.max(nz(judasFoundationConfirmBar, bar_index), nz(judasSupport.breakBar, bar_index)))
                      if bar_index > judasEligibleAfter
                          bool judasRetest = market.overlaps(judasSupport.top, judasSupport.bottom, high, low)
                          if judasRetest
                              judasSupport.touching := true
                          bool judasDirectionalPass = not requireDirectionalCandle or (judasDirection == market.DIR_LONG ? close > open : close < open)
                          bool judasOutsideClose = judasDirection == market.DIR_LONG ? close > judasSupport.top : close < judasSupport.bottom
                          if judasSupport.touching and judasOutsideClose and judasDirectionalPass
                              judasSupport.status := market.STATUS_CONFIRMED
                              judasSupport.confirmBar := bar_index
                              judasSupportConfirmBar := bar_index
                              judasWindowResolved := true
                              string judasRule = judasDirection == market.DIR_LONG ? "JUDAS-SEQUENCE-BUY" : "JUDAS-SEQUENCE-SELL"
                              judasSequenceSignal := market.makeSignal(judasDirection, market.FAMILY_30M_REVERSAL, judasFoundation.top, judasFoundation.bottom, judasFoundation.invalidation, judasFoundation.sourceBar, judasFoundation.sourceTime, currentWindow, judasFoundation.sourceBar, true, false, judasRule, "CURRENT_WINDOW_OB_BOLO_THEN_BOUND_IMB_RETEST_JUDAS")

          // =============================================================================
          // Signal selection
          // =============================================================================
          selectedSignal = market.newSignal()
          if recoverySignal.valid
              selectedSignal := market.copySignal(recoverySignal)
          else if judasSequenceSignal.valid
              selectedSignal := market.copySignal(judasSequenceSignal)'''

          if selection_anchor not in text:
              raise RuntimeError('signal selection anchor not found')
          text = text.replace(selection_anchor, replacement, 1)

          text = text.replace(
              'bool directionalPass = not requireDirectionalCandle or recoveryDirection == market.DIR_LONG ? close > open : close < open',
              'bool directionalPass = not requireDirectionalCandle or (recoveryDirection == market.DIR_LONG ? close > open : close < open)',
              1
          )

          diagnostic_anchor = '''plot(recoverySupportConfirmBar, "Bound IMB Confirm Bar", display = display.data_window)
          plot(tradeActive ? tradeDirection : 0, "Active Trade Direction", display = display.data_window)'''
          diagnostic_replacement = '''plot(recoverySupportConfirmBar, "Bound IMB Confirm Bar", display = display.data_window)
          plot(judasFoundation.active ? judasFoundation.bottom : na, "Judas Foundation Bottom", display = display.data_window)
          plot(judasFoundation.active ? judasFoundation.top : na, "Judas Foundation Top", display = display.data_window)
          plot(judasFoundationConfirmBar, "Judas Foundation Confirm Bar", display = display.data_window)
          plot(judasSupport.active ? judasSupport.bottom : na, "Judas Bound IMB Bottom", display = display.data_window)
          plot(judasSupport.active ? judasSupport.top : na, "Judas Bound IMB Top", display = display.data_window)
          plot(judasSupportConfirmBar, "Judas Bound IMB Confirm Bar", display = display.data_window)
          plot(tradeActive ? tradeDirection : 0, "Active Trade Direction", display = display.data_window)'''
          if diagnostic_anchor not in text:
              raise RuntimeError('diagnostic anchor not found')
          text = text.replace(diagnostic_anchor, diagnostic_replacement, 1)

          required = [
              'shorttitle = "PO3E941H"',
              'deliveryUsesFixedTarget = input.bool(false',
              'var judasFoundation = market.newStructure()',
              'judasSequenceSignal = market.newSignal()',
              'CURRENT_WINDOW_OB_BOLO_THEN_BOUND_IMB_RETEST_JUDAS',
              'else if judasSequenceSignal.valid'
          ]
          forbidden = ['JUDAS-OB-BUY', 'JUDAS-OB-SELL', 'JUDAS-IMB-BUY', 'JUDAS-IMB-SELL', 'judasFoundationSignal', 'judasImbSignal']
          for item in required:
              if item not in text:
                  raise RuntimeError(f'missing required patch: {item}')
          for item in forbidden:
              if item in text:
                  raise RuntimeError(f'forbidden standalone Judas path remains: {item}')

          target.write_text(text, encoding='utf-8')
          workflow.unlink()
          PY

      - name: Commit generated strategy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add V9.4.1 sequenced Judas entries and persistent delivery hold"
          git push origin HEAD:enigma-v9-3-window-narrative
