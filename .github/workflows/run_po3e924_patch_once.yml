name: Run PO3E924 patch once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run_po3e924_patch_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply target-branch patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin enigma-v9-2-judas-window-reversal
          git checkout enigma-v9-2-judas-window-reversal

          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch_po3e924_bolo_imb_handoff.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          block = []
          for line in lines[start:end + 1]:
              block.append(line[10:] if line.startswith('          ') else line.lstrip())
          Path('/tmp/apply_po3e924.sh').write_text('\n'.join(block) + '\n', encoding='utf-8')
          PY

          bash /tmp/apply_po3e924.sh
          git rm .github/workflows/patch_po3e924_bolo_imb_handoff.yml
          git add enigma/PO3_MMXM_Enigma_Strategy_V9_2_3_BOLO.pine
          git commit -m "Apply PO3E924 BOLO IMB handoff fix"
          git push origin HEAD:enigma-v9-2-judas-window-reversal

      - name: Remove one-time launcher
        shell: bash
        run: |
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/run_po3e924_patch_once.yml
          git commit -m "Remove one-time PO3E924 patch launcher"
          git push origin main
