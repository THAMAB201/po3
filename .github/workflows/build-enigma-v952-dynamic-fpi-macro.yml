name: Build Enigma V9.5.2 Dynamic FPI Macro

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/triggers/build-enigma-v952.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout strategy branch
        uses: actions/checkout@v4
        with:
          ref: enigma-v9-3-window-narrative
          fetch-depth: 0

      - name: Create dynamic Session and Macro FPI strategy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_5_1_Session_Recovery_Decoupled.pine')
          target = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_5_2_Dynamic_Session_Macro_Roles.pine')
          text = source.read_text(encoding='utf-8')

          text = text.replace(
              '"PO3 MMXM Enigma V9.5.1 Session Recovery Decoupled",\n    shorttitle = "PO3E951R",',
              '"PO3 MMXM Enigma V9.5.2 Dynamic Session Macro Roles",\n    shorttitle = "PO3E952D",',
              1,
          )

          old_session_input = '''bool enableSessionMacroBreakJudas = input.bool(true, "Session + First Macro Break Enables Judas Sequence", group = G_SESSION, tooltip = "Minimal tactical patch. A body close beyond both the Session FPI and first Macro FPI in the direction opposite Session bias latches counter-bias authority. Entry still requires the existing current-window OB/BOLO -> aligned IMB -> later retest sequence.")'''
          new_session_input = '''bool enableSessionMacroBreakJudas = input.bool(true, "Session + First Macro Break Enables Judas Sequence", group = G_SESSION, tooltip = "A completed body close through Session FPI plus First Macro support toward the opposite direction permits a Judas sequence. It never creates a standalone trade; OB/BOLO -> aligned IMB -> later retest/close remains mandatory.")
          bool requireMacroContextForEntries = input.bool(true, "Require First Macro Context After It Forms", group = G_SESSION, tooltip = "Before the First Macro FPI exists, local 30-minute authority may operate. After it forms, new Session-direction or Judas entries must be supported by the Macro FPI: aligned FPI support or opposite FPI body-close failure toward the intended direction.")'''
          if old_session_input not in text:
              raise RuntimeError('session input anchor not found')
          text = text.replace(old_session_input, new_session_input, 1)

          old_states = '''int PHASE_WAIT = 0
          int PHASE_SESSION = 1
          int PHASE_JUDAS = 2
          int PHASE_DELIVERY = 3

          int WINDOW_SEARCH_FOUNDATION = 0'''
          new_states = '''int PHASE_WAIT = 0
          int PHASE_SESSION = 1
          int PHASE_JUDAS = 2
          int PHASE_DELIVERY = 3

          int FPI_RELATION_NONE = 0
          int FPI_RELATION_SUPPORTIVE = 1
          int FPI_RELATION_TESTING = 2
          int FPI_RELATION_FAILED = 3

          int WINDOW_SEARCH_FOUNDATION = 0'''
          if old_states not in text:
              raise RuntimeError('state constants anchor not found')
          text = text.replace(old_states, new_states, 1)

          old_helper = '''windowFromTimestamp(int timestampValue) => market.windowFromMinute(minuteFromTimestamp(timestampValue))
          sideColor(int direction) => direction == market.DIR_LONG ? color.green : direction == market.DIR_SHORT ? color.red : color.gray

          newZone'''
          new_helper = '''windowFromTimestamp(int timestampValue) => market.windowFromMinute(minuteFromTimestamp(timestampValue))
          sideColor(int direction) => direction == market.DIR_LONG ? color.green : direction == market.DIR_SHORT ? color.red : color.gray

          fpiRelationState(structure) =>
              int relation = FPI_RELATION_NONE
              if structure.active
                  relation := structure.direction == market.DIR_LONG ? (close > structure.top ? FPI_RELATION_SUPPORTIVE : close < structure.bottom ? FPI_RELATION_FAILED : FPI_RELATION_TESTING) : (close < structure.bottom ? FPI_RELATION_SUPPORTIVE : close > structure.top ? FPI_RELATION_FAILED : FPI_RELATION_TESTING)
              relation

          fpiSupportsDirection(structure, int desiredDirection) =>
              int relation = fpiRelationState(structure)
              desiredDirection == structure.direction ? relation == FPI_RELATION_SUPPORTIVE : desiredDirection == -structure.direction and relation == FPI_RELATION_FAILED

          newZone'''
          if old_helper not in text:
              raise RuntimeError('helper insertion anchor not found')
          text = text.replace(old_helper, new_helper, 1)

          old_persistent = '''var bool sessionMacroBreakLatched = false
          var int sessionMacroBreakDirection = market.DIR_NONE
          var int sessionMacroBreakBar = na
          var macroBgob = market.newStructure()'''
          new_persistent = '''var bool sessionMacroBreakLatched = false
          var int sessionMacroBreakDirection = market.DIR_NONE
          var int sessionMacroBreakBar = na
          var bool sessionFpiDisrespected = false
          var int sessionFpiDisrespectBar = na
          var int sessionRecoveryBar = na
          var int macroFpiRelation = FPI_RELATION_NONE
          var macroBgob = market.newStructure()'''
          if old_persistent not in text:
              raise RuntimeError('persistent state anchor not found')
          text = text.replace(old_persistent, new_persistent, 1)

          old_reset = '''    sessionMacroBreakLatched := false
              sessionMacroBreakDirection := market.DIR_NONE
              sessionMacroBreakBar := na
              macroBgob := market.newStructure()'''
          new_reset = '''    sessionMacroBreakLatched := false
              sessionMacroBreakDirection := market.DIR_NONE
              sessionMacroBreakBar := na
              sessionFpiDisrespected := false
              sessionFpiDisrespectBar := na
              sessionRecoveryBar := na
              macroFpiRelation := FPI_RELATION_NONE
              macroBgob := market.newStructure()'''
          if old_reset not in text:
              raise RuntimeError('session reset anchor not found')
          text = text.replace(old_reset, new_reset, 1)

          old_disrespect = '''// =============================================================================
          // Session FPI disrespect is latched. A wick is not enough.
          // =============================================================================
          if sessionFpiFound and not judasCompleted and bar_index > sessionFpi.sourceBar
              bool sessionDisrespect = market.bodyCloseInvalidates(sessionDirection, sessionDirection == market.DIR_LONG ? sessionFpi.bottom : sessionFpi.top, close)
              if sessionDisrespect and phase != PHASE_JUDAS
                  phase := PHASE_JUDAS
                  judasStartWindow := currentWindow

          int judasDirection = sessionDirection == market.DIR_NONE ? market.DIR_NONE : -sessionDirection'''
          new_disrespect = '''// =============================================================================
          // Session FPI lifecycle. A wick never changes state. Disrespect remains
          // latched until a completed Session-direction structure confirms recovery.
          // =============================================================================
          if sessionFpiFound and bar_index > sessionFpi.sourceBar
              bool sessionDisrespectNow = market.bodyCloseInvalidates(sessionDirection, sessionDirection == market.DIR_LONG ? sessionFpi.bottom : sessionFpi.top, close)
              if sessionDisrespectNow and not sessionFpiDisrespected
                  sessionFpiDisrespected := true
                  sessionFpiDisrespectBar := bar_index
                  phase := PHASE_JUDAS
                  if judasStartWindow < 0
                      judasStartWindow := currentWindow

          int judasDirection = sessionDirection == market.DIR_NONE ? market.DIR_NONE : -sessionDirection'''
          if old_disrespect not in text:
              raise RuntimeError('session disrespect block not found')
          text = text.replace(old_disrespect, new_disrespect, 1)

          old_macro_block = '''// =============================================================================
          // Minimal Session + first-Macro break latch
          // This does not add a standalone entry. It only releases the existing
          // current-window Judas OB/BOLO -> aligned IMB -> later-retest sequence.
          // Existing delivery, recovery, stops, targets and entry priorities remain unchanged.
          // =============================================================================
          bool sessionBrokenOppositeNow = sessionFpiFound and sessionDirection != market.DIR_NONE and (sessionDirection == market.DIR_LONG ? close < sessionFpi.bottom : close > sessionFpi.top)
          bool macroBrokenOppositeNow = macroFpiFound and sessionDirection != market.DIR_NONE and (sessionDirection == market.DIR_LONG ? close < macroFpi.bottom : close > macroFpi.top)
          bool dualFpiBreakNow = enableSessionMacroBreakJudas and confirmedBar and sessionBrokenOppositeNow and macroBrokenOppositeNow

          if dualFpiBreakNow and not sessionMacroBreakLatched
              sessionMacroBreakLatched := true
              sessionMacroBreakDirection := -sessionDirection
              sessionMacroBreakBar := bar_index
              phase := PHASE_JUDAS
              if judasStartWindow < 0
                  judasStartWindow := currentWindow
              // Latch tactical authority without disturbing the current window's
              // stored OB/BOLO and IMB candidates.
              windowAuthority := sessionMacroBreakDirection

          // =============================================================================
          // Persistent local-window FPI authority'''
          new_macro_block = '''// =============================================================================
          // Dynamic First Macro FPI relationship.
          // SUPPORTIVE = price beyond the zone in the FPI direction.
          // TESTING    = price inside the FPI.
          // FAILED     = body close beyond the opposite edge.
          // =============================================================================
          macroFpiRelation := macroFpiFound ? fpiRelationState(macroFpi) : FPI_RELATION_NONE
          bool macroSupportsSessionNow = not macroFpiFound or fpiSupportsDirection(macroFpi, sessionDirection)
          bool macroSupportsJudasNow = macroFpiFound and judasDirection != market.DIR_NONE and fpiSupportsDirection(macroFpi, judasDirection)

          // =============================================================================
          // Persistent local-window FPI authority'''
          if old_macro_block not in text:
              raise RuntimeError('old macro latch block not found')
          text = text.replace(old_macro_block, new_macro_block, 1)

          old_local_end = '''        if opposingWindowDisrespected
                  windowAuthority := sessionDirection
                  windowFpiDisrespectedTowardSession := true

          // =============================================================================
          // Dynamic current-window recovery narrative'''
          new_local_end = '''        if opposingWindowDisrespected
                  windowAuthority := sessionDirection
                  windowFpiDisrespectedTowardSession := true

          // Counter-bias authority is reevaluated continuously. It requires an
          // already-disrespected Session FPI plus either First Macro support toward
          // Judas direction or, before Macro exists, the active 30m FPI authority.
          bool localSupportsJudasNow = windowFirstFpiFound and windowAuthority == judasDirection
          bool dynamicJudasAuthorityNow = enableSessionMacroBreakJudas and sessionFpiDisrespected and judasDirection != market.DIR_NONE and (macroFpiFound ? macroSupportsJudasNow : localSupportsJudasNow)
          if dynamicJudasAuthorityNow
              if not sessionMacroBreakLatched
                  sessionMacroBreakBar := bar_index
              sessionMacroBreakLatched := true
              sessionMacroBreakDirection := judasDirection
              phase := PHASE_JUDAS
              if judasStartWindow < 0
                  judasStartWindow := currentWindow
          else if not tradeIsJudas
              sessionMacroBreakLatched := false
              sessionMacroBreakDirection := market.DIR_NONE
              sessionMacroBreakBar := na

          // =============================================================================
          // Dynamic current-window recovery narrative'''
          if old_local_end not in text:
              raise RuntimeError('local authority insertion anchor not found')
          text = text.replace(old_local_end, new_local_end, 1)

          old_recovery_gate = '''bool recoveryLaterWindowPass = phase != PHASE_JUDAS or not requireLaterWindowForRecovery or currentWindow > judasStartWindow
          bool recoveryLocalFpiPass = windowFirstFpiFound and windowAuthority == sessionDirection
          bool recoveryStructureEligible = sessionFpiFound and currentWindow >= 0 and recoveryLaterWindowPass
          bool recoveryWindowEligible = recoveryStructureEligible and (allowSessionRecoveryWithoutLocalFpi or recoveryLocalFpiPass)
          recoveryDirection = sessionDirection'''
          new_recovery_gate = '''bool recoveryLaterWindowPass = not sessionFpiDisrespected or not requireLaterWindowForRecovery or currentWindow > judasStartWindow
          bool recoveryLocalFpiPass = windowFirstFpiFound and windowAuthority == sessionDirection
          bool recoveryMacroPass = not requireMacroContextForEntries or not macroFpiFound or macroSupportsSessionNow
          bool recoveryStructureEligible = sessionFpiFound and currentWindow >= 0 and recoveryLaterWindowPass
          bool recoveryWindowEligible = recoveryStructureEligible and recoveryMacroPass and (allowSessionRecoveryWithoutLocalFpi or recoveryLocalFpiPass)
          recoveryDirection = sessionDirection'''
          if old_recovery_gate not in text:
              raise RuntimeError('recovery gate block not found')
          text = text.replace(old_recovery_gate, new_recovery_gate, 1)

          old_recovery_signal = '''            string recoveryRule = phase == PHASE_JUDAS ? (recoveryDirection == market.DIR_LONG ? "JUDAS-END-BUY" : "JUDAS-END-SELL") : (recoveryDirection == market.DIR_LONG ? "WINDOW-DELIVERY-BUY" : "WINDOW-DELIVERY-SELL")
                      recoverySignal := market.makeSignal(recoveryDirection, market.FAMILY_30M_REVERSAL, recoveryFoundation.top, recoveryFoundation.bottom, recoveryFoundation.invalidation, recoveryFoundation.sourceBar, recoveryFoundation.sourceTime, currentWindow, recoveryFoundation.sourceBar, true, phase == PHASE_JUDAS, recoveryRule, "CONFIRMED_EXTREME_OB_BOLO_THEN_ALIGNED_IMB_RETEST_RESPECT")'''
          new_recovery_signal = '''            bool recoveryAfterDisrespect = sessionFpiDisrespected
                      string recoveryRule = recoveryAfterDisrespect ? (recoveryDirection == market.DIR_LONG ? "SESSION-RECOVERY-BUY" : "SESSION-RECOVERY-SELL") : (recoveryDirection == market.DIR_LONG ? "SESSION-DELIVERY-BUY" : "SESSION-DELIVERY-SELL")
                      recoverySignal := market.makeSignal(recoveryDirection, market.FAMILY_30M_REVERSAL, recoveryFoundation.top, recoveryFoundation.bottom, recoveryFoundation.invalidation, recoveryFoundation.sourceBar, recoveryFoundation.sourceTime, currentWindow, recoveryFoundation.sourceBar, true, false, recoveryRule, "SESSION_DIRECTION_EXTREME_OB_BOLO_THEN_ALIGNED_IMB_RETEST_RESPECT")'''
          if old_recovery_signal not in text:
              raise RuntimeError('recovery signal classification block not found')
          text = text.replace(old_recovery_signal, new_recovery_signal, 1)

          text = text.replace('"WINDOW-BGOB-BUY" : "WINDOW-BGOB-SELL"', '"SESSION-BGOB-BUY" : "SESSION-BGOB-SELL"')
          text = text.replace('"MACRO-BGOB-BUY" : "MACRO-BGOB-SELL"', '"SESSION-MACRO-BGOB-BUY" : "SESSION-MACRO-BGOB-SELL"')

          old_judas_gate = '''bool localJudasAuthority = windowFirstFpiFound and windowAuthority == judasDirection
          bool dualFpiJudasAuthority = sessionMacroBreakLatched and sessionMacroBreakDirection == judasDirection and not na(sessionMacroBreakBar) and bar_index >= sessionMacroBreakBar
          bool judasAuthorityPass = (localJudasAuthority or dualFpiJudasAuthority) and not (suspendJudasOnConfirmedSessionFoundation and sessionRecoveryBuildingNow)'''
          new_judas_gate = '''bool localJudasAuthority = windowFirstFpiFound and windowAuthority == judasDirection
          bool dualFpiJudasAuthority = sessionMacroBreakLatched and sessionMacroBreakDirection == judasDirection and not na(sessionMacroBreakBar) and bar_index >= sessionMacroBreakBar
          bool judasMacroPass = not requireMacroContextForEntries or not macroFpiFound or macroSupportsJudasNow
          bool judasAuthorityPass = sessionFpiDisrespected and judasMacroPass and (localJudasAuthority or dualFpiJudasAuthority) and not (suspendJudasOnConfirmedSessionFoundation and sessionRecoveryBuildingNow)'''
          if old_judas_gate not in text:
              raise RuntimeError('judas authority block not found')
          text = text.replace(old_judas_gate, new_judas_gate, 1)

          old_order_head = '''if canSubmit and selectedSignal.valid and canOpenOrReverse
              bool entryIsRecovery = sessionCandidateSignal.valid and selectedSignal.direction == sessionDirection
              bool entryIsJudas = phase == PHASE_JUDAS and judasCandidateSignal.valid and selectedSignal.direction == judasDirection and not entryIsRecovery
              float entryPrice = close'''
          new_order_head = '''bool selectedRoleValid = selectedSignal.valid and sessionFpiFound and (selectedSignal.direction == sessionDirection or selectedSignal.direction == judasDirection)

          if canSubmit and selectedRoleValid and canOpenOrReverse
              // Trade role is immutable and based only on direction relative to
              // Session FPI. Campaign phase never renames a Session-direction trade.
              bool entryIsRecovery = selectedSignal.direction == sessionDirection
              bool entryIsJudas = selectedSignal.direction == judasDirection
              float entryPrice = close'''
          if old_order_head not in text:
              raise RuntimeError('order role classification block not found')
          text = text.replace(old_order_head, new_order_head, 1)

          old_entry_recovery = '''    if entryIsRecovery
                  phase := PHASE_DELIVERY
                  judasCompleted := true
                  sessionMacroBreakLatched := false
                  sessionMacroBreakDirection := market.DIR_NONE
                  sessionMacroBreakBar := na
              else if entryIsJudas'''
          new_entry_recovery = '''    if entryIsRecovery
                  phase := PHASE_DELIVERY
                  judasCompleted := true
                  sessionFpiDisrespected := false
                  sessionRecoveryBar := bar_index
                  judasStartWindow := -1
                  sessionMacroBreakLatched := false
                  sessionMacroBreakDirection := market.DIR_NONE
                  sessionMacroBreakBar := na
              else if entryIsJudas'''
          if old_entry_recovery not in text:
              raise RuntimeError('entry recovery transition block not found')
          text = text.replace(old_entry_recovery, new_entry_recovery, 1)

          old_diag = '''plot(sessionMacroBreakLatched ? sessionMacroBreakDirection : 0, "Session + Macro Break Judas Authority", display = display.data_window)
          plot(sessionMacroBreakBar, "Session + Macro Break Bar", display = display.data_window)
          plot(phase, "Campaign Phase", display = display.data_window)'''
          new_diag = '''plot(sessionFpiDisrespected ? 1 : 0, "Session FPI Disrespected", display = display.data_window)
          plot(sessionFpiDisrespectBar, "Session FPI Disrespect Bar", display = display.data_window)
          plot(sessionRecoveryBar, "Session Recovery Confirmation Bar", display = display.data_window)
          plot(macroFpiRelation, "First Macro FPI Relation", display = display.data_window)
          plot(macroSupportsSessionNow ? 1 : 0, "Macro Supports Session Direction", display = display.data_window)
          plot(macroSupportsJudasNow ? 1 : 0, "Macro Supports Judas Direction", display = display.data_window)
          plot(sessionMacroBreakLatched ? sessionMacroBreakDirection : 0, "Dynamic Judas Authority", display = display.data_window)
          plot(sessionMacroBreakBar, "Dynamic Judas Authority Bar", display = display.data_window)
          plot(phase, "Campaign Phase", display = display.data_window)'''
          if old_diag not in text:
              raise RuntimeError('diagnostic block not found')
          text = text.replace(old_diag, new_diag, 1)

          required = [
              'shorttitle = "PO3E952D"',
              'Require First Macro Context After It Forms',
              'fpiRelationState',
              'sessionFpiDisrespected',
              'macroSupportsSessionNow',
              'dynamicJudasAuthorityNow',
              'SESSION-RECOVERY-SELL',
              'bool entryIsRecovery = selectedSignal.direction == sessionDirection',
              'bool entryIsJudas = selectedSignal.direction == judasDirection',
              'Dynamic Judas Authority',
          ]
          for marker in required:
              if marker not in text:
                  raise RuntimeError(f'missing V9.5.2 marker: {marker}')

          forbidden = [
              'JUDAS-END-BUY',
              'JUDAS-END-SELL',
              'bool entryIsJudas = phase == PHASE_JUDAS',
          ]
          for marker in forbidden:
              if marker in text:
                  raise RuntimeError(f'stale misclassification remains: {marker}')

          target.write_text(text, encoding='utf-8')
          PY

      - name: Commit full strategy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enigma/PO3_MMXM_Enigma_Strategy_V9_5_2_Dynamic_Session_Macro_Roles.pine
          git commit -m "Add V9.5.2 dynamic Session and Macro FPI role engine"
          git push origin HEAD:enigma-v9-3-window-narrative
