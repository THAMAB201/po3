name: Patch V9.2 Source

on:
  push:
    branches:
      - enigma-v9-2-judas-window-reversal

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-v9.2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enigma-v9-2-judas-window-reversal

      - name: Apply deterministic source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_2.pine')
          text = path.read_text()

          text = text.replace('event.parentId', 'event.sourceTime')

          old = '''bool reversingJudas = tradeActive and tradeIsJudas and judasReversalSignal.valid and judasReversalSignal.direction == -tradeDirection
bool freshEntry = not tradeActive and strategy.position_size == 0

if canSubmit and selectedSignal.valid and (freshEntry or reversingJudas)'''
          new = '''bool reversingJudas = tradeActive and tradeIsJudas and judasReversalSignal.valid and judasReversalSignal.direction == -tradeDirection
bool crossSessionReversal = tradeActive and currentSession != tradeEntrySession and selectedSignal.valid and selectedSignal.direction == structuralDirection and selectedSignal.direction == -tradeDirection
bool freshEntry = not tradeActive and strategy.position_size == 0

if canSubmit and selectedSignal.valid and (freshEntry or reversingJudas or crossSessionReversal)'''
          if old not in text:
              raise SystemExit('Expected order-submission block not found')
          text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enigma/PO3_MMXM_Enigma_Strategy_V9_2.pine
          if ! git diff --cached --quiet; then
            git commit -m "[patched-v9.2] Fix FPI event parent and cross-session reversal"
            git push origin HEAD:enigma-v9-2-judas-window-reversal
          fi
