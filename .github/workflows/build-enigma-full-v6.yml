name: Build Enigma Full V6

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'BUILD ENIGMA FULL V6'
    runs-on: ubuntu-latest
    steps:
      - name: Check out professional package branch
        uses: actions/checkout@v4
        with:
          ref: enigma-professional-package

      - name: Assemble full source and apply modular refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('PO3_MMXM_Enigma/.build/assemble_engine.py')
          text = path.read_text(encoding='utf-8')
          old = 'PARTS = [ROOT / f"engine.part{i:02d}" for i in range(1, 10)]'
          new = '''PARTS = [
              ROOT / "engine.part01",
              ROOT / "engine.part02",
              ROOT / "engine.part03",
              ROOT / "engine.part03b",
              ROOT / "engine.part04",
              ROOT / "engine.part05",
              ROOT / "engine.part06",
              ROOT / "engine.part07",
              ROOT / "engine.part08",
              ROOT / "engine.part09",
          ]'''
          if old not in text:
              raise RuntimeError('Assembler part declaration not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python PO3_MMXM_Enigma/.build/assemble_engine.py
          python PO3_MMXM_Enigma/.build/refactor_full_engine_v6.py

      - name: Validate package shape
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('PO3_MMXM_Enigma')
          engine = (root / 'PO3_MMXM_Enigma_Execution_Engine.pine').read_text(encoding='utf-8')
          foundation = (root / 'PO3_MMXM_Enigma_Foundation_Engine.pine').read_text(encoding='utf-8')
          strategy = (root / 'PO3_MMXM_Enigma_Strategy.pine').read_text(encoding='utf-8')
          assert len(engine.splitlines()) > 3000
          assert 'PO3MMXMEnigmaFoundationEngine/1' in engine
          assert 'import SunovaBeach/PO3MMXMEnigmaExecutionEngine/2 as baseEngine' not in engine
          assert 'externalFoundationSignalNow' in engine
          assert 'renderMtfVisuals(' in engine
          assert 'library("PO3MMXMEnigmaFoundationEngine"' in foundation
          assert 'PO3MMXMEnigmaExecutionEngine/6' in strategy
          print('Source-shape validation passed')
          PY

      - name: Commit complete package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PO3_MMXM_Enigma/PO3_MMXM_Enigma_Foundation_Engine.pine PO3_MMXM_Enigma/PO3_MMXM_Enigma_Execution_Engine.pine PO3_MMXM_Enigma/PO3_MMXM_Enigma_Strategy.pine
          git commit -m "Restore full engine with modular foundation execution"
          git push origin HEAD:enigma-professional-package

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Full modular engine build completed."
