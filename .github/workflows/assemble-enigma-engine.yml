name: Assemble Enigma Execution Engine

on:
  push:
    branches:
      - enigma-professional-package
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: enigma-professional-package

      - name: Assemble and validate execution engine
        run: python PO3_MMXM_Enigma/.build/assemble_engine.py

      - name: Commit generated execution engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PO3_MMXM_Enigma/PO3_MMXM_Enigma_Execution_Engine.pine
          if ! git diff --cached --quiet; then
            git commit -m "Assemble professionally named Enigma execution engine"
            git push origin HEAD:enigma-professional-package
          fi
