name: Run Enigma V9.5.0 Builder On PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main builder files
        uses: actions/checkout@v4
        with:
          ref: main
          path: builder

      - name: Checkout strategy branch
        uses: actions/checkout@v4
        with:
          ref: enigma-v9-3-window-narrative
          path: work
          fetch-depth: 0

      - name: Extract and run the V9.5.0 Python patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('builder/.github/workflows/build-enigma-v950-adaptive.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script_lines = workflow[start:end]
          nonempty = [len(line) - len(line.lstrip()) for line in script_lines if line.strip()]
          indent = min(nonempty) if nonempty else 0
          script = '\n'.join(line[indent:] for line in script_lines)
          subprocess.run(['python', '-c', script], cwd='work', check=True)
          PY

      - name: Commit generated full strategy
        shell: bash
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enigma/PO3_MMXM_Enigma_Strategy_V9_5_0_Adaptive_Narrative_Arbiter.pine
          git commit -m "Add V9.5.0 adaptive narrative arbiter" || exit 0
          git push origin HEAD:enigma-v9-3-window-narrative
