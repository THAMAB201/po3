name: Enigma Package Assembler

on:
  issues:
    types: [opened]
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  assemble:
    if: (github.event_name == 'issues' && github.event.issue.title == 'ASSEMBLE PO3 MMXM ENIGMA PACKAGE') || (github.event_name == 'pull_request' && github.head_ref == 'enigma-professional-package')
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: enigma-professional-package

      - name: Assemble and validate execution engine
        id: build
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('PO3_MMXM_Enigma/.build/assemble_engine.py')
          text = path.read_text(encoding='utf-8')
          old = 'PARTS = [ROOT / f"engine.part{i:02d}" for i in range(1, 10)]'
          new = '''PARTS = [
              ROOT / "engine.part01",
              ROOT / "engine.part02",
              ROOT / "engine.part03",
              ROOT / "engine.part03b",
              ROOT / "engine.part04",
              ROOT / "engine.part05",
              ROOT / "engine.part06",
              ROOT / "engine.part07",
              ROOT / "engine.part08",
              ROOT / "engine.part09",
          ]'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'ROOT / "engine.part03b"' not in text:
              raise RuntimeError('Assembler part declaration was not found')
          PY
          python PO3_MMXM_Enigma/.build/assemble_engine.py > /tmp/enigma-build.log 2>&1

      - name: Report assembly failure
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '```text' > /tmp/enigma-comment.md
          tail -40 /tmp/enigma-build.log >> /tmp/enigma-comment.md
          echo '```' >> /tmp/enigma-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file /tmp/enigma-comment.md
          exit 1

      - name: Commit generated execution engine
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PO3_MMXM_Enigma/PO3_MMXM_Enigma_Execution_Engine.pine
          if ! git diff --cached --quiet; then
            git commit -m "Implement aligned Judas foundation reclaim entry"
            git push origin HEAD:enigma-professional-package
          fi

      - name: Close trigger issue
        if: steps.build.outcome == 'success' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Execution engine assembly completed."
