name: Patch Enigma OB Retest V5

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == 'PATCH ENIGMA OB RETEST V5'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: enigma-professional-package

      - name: Apply direct OB retest patch
        run: python PO3_MMXM_Enigma/.build/patch_ob_retest_v5.py

      - name: Commit updated engine and strategy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PO3_MMXM_Enigma/PO3_MMXM_Enigma_Execution_Engine.pine PO3_MMXM_Enigma/PO3_MMXM_Enigma_Strategy.pine
          git commit -m "Enter directly on FPI-aligned OB retest"
          git push origin HEAD:enigma-professional-package

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Direct OB retest v5 patch completed."
