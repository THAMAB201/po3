name: Trigger Enigma V9.4.4 Builder

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enigma-v9-3-window-narrative
          fetch-depth: 0
          show-progress: false

      - name: Build and postpatch V9.4.4
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/scripts/build_enigma_v944.py > /tmp/build_v944.py
          git show origin/main:.github/scripts/postpatch_enigma_v944.py > /tmp/postpatch_v944.py
          set +e
          python /tmp/build_v944.py > /tmp/build_v944.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python /tmp/postpatch_v944.py >> /tmp/build_v944.log 2>&1
            status=$?
          fi
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/build_v944.log enigma/V944_BUILD_ERROR.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add enigma/V944_BUILD_ERROR.txt
            git commit -m "Capture V9.4.4 builder failure"
            git push origin HEAD:enigma-v9-3-window-narrative
            exit "$status"
          fi

      - name: Commit generated strategy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f enigma/V944_BUILD_ERROR.txt 2>/dev/null || true
          git add enigma/PO3_MMXM_Enigma_Strategy_V9_4_4_Dynamic_30m_Narrative.pine
          git commit -m "Add V9.4.4 dynamic 30-minute narrative"
          git push origin HEAD:enigma-v9-3-window-narrative
