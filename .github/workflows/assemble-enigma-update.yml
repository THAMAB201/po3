name: Assemble Enigma Update

on:
  push:
    branches:
      - enigma-professional-package
    paths:
      - PO3_MMXM_Enigma/.build/REBUILD_NOTE.txt

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: enigma-professional-package

      - name: Assemble and validate execution engine
        run: python PO3_MMXM_Enigma/.build/assemble_engine.py

      - name: Commit generated execution engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PO3_MMXM_Enigma/PO3_MMXM_Enigma_Execution_Engine.pine
          if ! git diff --cached --quiet; then
            git commit -m "Implement aligned Judas foundation reclaim entry"
            git push origin HEAD:enigma-professional-package
          fi
