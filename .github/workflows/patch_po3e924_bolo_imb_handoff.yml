name: Patch PO3E924 BOLO IMB handoff

on:
  push:
    branches:
      - enigma-v9-2-judas-window-reversal
    paths:
      - .github/workflows/patch_po3e924_bolo_imb_handoff.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply PO3E924 BOLO IMB handoff fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enigma-v9-2-judas-window-reversal
          fetch-depth: 0

      - name: Patch complete strategy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_2_3_BOLO.pine')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              '"PO3 MMXM Enigma V9.2.3 BOLO",\n    shorttitle = "PO3E923B",',
              '"PO3 MMXM Enigma V9.2.4 BOLO IMB Handoff",\n    shorttitle = "PO3E924H",',
              'version header',
          )

          replace_once(
              'var bool judasFoundationValidated = false\nvar bool judasSupportTouched = false\nvar int judasReversalConfirmBar = na',
              '''var bool judasFoundationValidated = false
var bool judasSupportTouched = false
var int judasReversalConfirmBar = na

// Persistent BOLO -> IMB reversal handoff. This is separate from the generic
// signal bucket so a confirmed BOLO cannot be hidden by another same-bar setup.
var bool boloHandoffArmed = false
var int boloHandoffDirection = market.DIR_NONE
var int boloHandoffConfirmBar = na
var int boloHandoffWindow = -1
var float boloHandoffTop = na
var float boloHandoffBottom = na
var float boloHandoffInvalidation = na''',
              'persistent handoff state',
          )

          replace_once(
              '    judasFoundationValidated := false\n    judasSupportTouched := false\n    judasReversalConfirmBar := na\n    orbHigh := na',
              '''    judasFoundationValidated := false
    judasSupportTouched := false
    judasReversalConfirmBar := na
    boloHandoffArmed := false
    boloHandoffDirection := market.DIR_NONE
    boloHandoffConfirmBar := na
    boloHandoffWindow := -1
    boloHandoffTop := na
    boloHandoffBottom := na
    boloHandoffInvalidation := na
    orbHigh := na''',
              'session reset',
          )

          replace_once(
              '        judasFoundationValidated := false\n        judasSupportTouched := false\n        judasReversalConfirmBar := na\n\n// Macro lifecycle.',
              '''        judasFoundationValidated := false
        judasSupportTouched := false
        judasReversalConfirmBar := na
        boloHandoffArmed := false
        boloHandoffDirection := market.DIR_NONE
        boloHandoffConfirmBar := na
        boloHandoffWindow := -1
        boloHandoffTop := na
        boloHandoffBottom := na
        boloHandoffInvalidation := na

// Macro lifecycle.''',
              'Judas reset',
          )

          replace_once(
              '''if bullObSignal.valid
    parentObActive := true
    parentObDirection := market.DIR_LONG
    parentObId := bullObSignal.parentId
    parentObRespectBar := bar_index

if bearObSignal.valid
    parentObActive := true
    parentObDirection := market.DIR_SHORT
    parentObId := bearObSignal.parentId
    parentObRespectBar := bar_index''',
              '''if bullObSignal.valid
    parentObActive := true
    parentObDirection := market.DIR_LONG
    parentObId := bullObSignal.parentId
    parentObRespectBar := bar_index

    // A confirmed bullish BOLO while an opposite sell is active arms the exact
    // reversal sequence. The next confirmed bullish/post-BOLO IMB is the entry.
    if tradeActive and tradeDirection == market.DIR_SHORT and structuralDirection == market.DIR_LONG
        boloHandoffArmed := true
        boloHandoffDirection := market.DIR_LONG
        boloHandoffConfirmBar := bar_index
        boloHandoffWindow := currentWindow
        boloHandoffTop := bullObSignal.top
        boloHandoffBottom := bullObSignal.bottom
        boloHandoffInvalidation := bullObSignal.bottom

if bearObSignal.valid
    parentObActive := true
    parentObDirection := market.DIR_SHORT
    parentObId := bearObSignal.parentId
    parentObRespectBar := bar_index

    // Bearish mirror of the bullish BOLO -> IMB handoff.
    if tradeActive and tradeDirection == market.DIR_LONG and structuralDirection == market.DIR_SHORT
        boloHandoffArmed := true
        boloHandoffDirection := market.DIR_SHORT
        boloHandoffConfirmBar := bar_index
        boloHandoffWindow := currentWindow
        boloHandoffTop := bearObSignal.top
        boloHandoffBottom := bearObSignal.bottom
        boloHandoffInvalidation := bearObSignal.top

// An FPI can complete on the same bar that confirms the BOLO. Because structure
// creation runs earlier in this script, explicitly preserve that FPI as the
// post-BOLO IMB so its later retest is not lost.
if enablePostObImb and eligibleFpi
    if bullObSignal.valid and fpiEvent.direction == market.DIR_LONG
        sameBarPostBolo = market.structureFromFpi(fpiEvent, market.FAMILY_POST_OB_IMB, "POSTBOLO-BULL-01", "POST_BOLO_BULL_IMB")
        armMoreExtreme(postObImb, sameBarPostBolo, market.DIR_LONG)
    else if bearObSignal.valid and fpiEvent.direction == market.DIR_SHORT
        sameBarPostBolo = market.structureFromFpi(fpiEvent, market.FAMILY_POST_OB_IMB, "POSTBOLO-BEAR-01", "POST_BOLO_BEAR_IMB")
        armMoreExtreme(postObImb, sameBarPostBolo, market.DIR_SHORT)''',
              'BOLO handoff arming',
          )

          replace_once(
              '''bool supportEvidencePass = supportConfirmedNow or openingSupportHeldNow
bool laterWindowPass = not requireLaterWindowForJudasEnd or laterThanJudas
bool reversalEvidencePass =
     requireFoundationAndImb ? judasFoundationValidated and supportEvidencePass :
     familyAllowed

bool judasReversalReady = phase == PHASE_JUDAS and laterWindowPass and reversalEvidencePass
judasReversalSignal = market.newSignal()

if judasReversalReady and bar_index != judasReversalConfirmBar''',
              '''bool supportEvidencePass = supportConfirmedNow or openingSupportHeldNow
bool laterWindowPass = not requireLaterWindowForJudasEnd or laterThanJudas
bool reversalEvidencePass =
     requireFoundationAndImb ? judasFoundationValidated and supportEvidencePass :
     familyAllowed

// Dedicated BOLO -> IMB handoff. It is intentionally evaluated from the raw
// IMB signals rather than bullBaseSignal/bearBaseSignal, because the priority
// bucket can otherwise hide the IMB behind a BOLO or BGOB on the same bar.
bool alignedImbRetestNow =
     boloHandoffDirection == market.DIR_LONG ?
     (bullImbSignal.valid or postObSignal.valid and postObSignal.direction == market.DIR_LONG) :
     boloHandoffDirection == market.DIR_SHORT ?
     (bearImbSignal.valid or postObSignal.valid and postObSignal.direction == market.DIR_SHORT) :
     false

bool boloHandoffWindowPass =
     boloHandoffArmed and
     not na(boloHandoffConfirmBar) and
     bar_index > boloHandoffConfirmBar and
     currentWindow >= boloHandoffWindow

bool boloImbHandoffReady =
     boloHandoffWindowPass and
     alignedImbRetestNow and
     tradeActive and
     tradeDirection == -boloHandoffDirection and
     boloHandoffDirection == structuralDirection

bool judasReversalReady =
     phase == PHASE_JUDAS and laterWindowPass and reversalEvidencePass or
     boloImbHandoffReady

judasReversalSignal = market.newSignal()

if judasReversalReady and bar_index != judasReversalConfirmBar''',
              'direct IMB handoff readiness',
          )

          replace_once(
              '''    float topValue = judasFoundationValidated ? judasFoundation.top : judasSupportImb.top
    float bottomValue = judasFoundationValidated ? judasFoundation.bottom : judasSupportImb.bottom
    float invalidation = structuralDirection == market.DIR_LONG ? bottomValue : topValue
    int sourceWindowValue = judasFoundationValidated ? judasFoundation.sourceWindow : judasSupportImb.sourceWindow''',
              '''    float topValue =
         boloImbHandoffReady ? boloHandoffTop :
         judasFoundationValidated ? judasFoundation.top :
         judasSupportImb.top

    float bottomValue =
         boloImbHandoffReady ? boloHandoffBottom :
         judasFoundationValidated ? judasFoundation.bottom :
         judasSupportImb.bottom

    float invalidation =
         boloImbHandoffReady ? boloHandoffInvalidation :
         structuralDirection == market.DIR_LONG ? bottomValue : topValue

    int sourceWindowValue =
         boloImbHandoffReady ? currentWindow :
         judasFoundationValidated ? judasFoundation.sourceWindow :
         judasSupportImb.sourceWindow''',
              'handoff signal prices',
          )

          replace_once(
              '''         structuralDirection == market.DIR_LONG ? "JUDAS-END-BUY" : "JUDAS-END-SELL",
         structuralDirection == market.DIR_LONG ? "LATER_WINDOW_BOLO_VALIDATED_AND_IMB_HELD" : "LATER_WINDOW_BOLO_VALIDATED_AND_IMB_HELD"
    )

    judasReversalConfirmBar := bar_index''',
              '''         structuralDirection == market.DIR_LONG ? "JUDAS-END-BUY" : "JUDAS-END-SELL",
         boloImbHandoffReady ? "CONFIRMED_BOLO_THEN_IMB_RETEST_HANDOFF" : "LATER_WINDOW_BOLO_VALIDATED_AND_IMB_HELD"
    )

    judasReversalConfirmBar := bar_index''',
              'handoff reason',
          )

          replace_once(
              '''bool reversingJudas =
     tradeActive and
     tradeIsJudas and
     judasReversalSignal.valid and
     judasReversalSignal.direction == -tradeDirection''',
              '''bool reversingJudas =
     tradeActive and
     judasReversalSignal.valid and
     judasReversalSignal.direction == -tradeDirection and
     (tradeIsJudas or boloImbHandoffReady)''',
              'reversal order permission',
          )

          replace_once(
              '''            judasReversalConfirmBar := bar_index

            if structuralDirection == market.DIR_LONG''',
              '''            judasReversalConfirmBar := bar_index
            boloHandoffArmed := false
            boloHandoffDirection := market.DIR_NONE
            boloHandoffConfirmBar := na
            boloHandoffWindow := -1
            boloHandoffTop := na
            boloHandoffBottom := na
            boloHandoffInvalidation := na

            if structuralDirection == market.DIR_LONG''',
              'clear handoff after delivery',
          )

          path.write_text(text, encoding='utf-8')
          print(f'Patched {path} to PO3E924H')
          PY

      - name: Commit strategy and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch_po3e924_bolo_imb_handoff.yml
          git add enigma/PO3_MMXM_Enigma_Strategy_V9_2_3_BOLO.pine
          git commit -m "Apply PO3E924 BOLO IMB handoff fix"
          git push origin HEAD:enigma-v9-2-judas-window-reversal
