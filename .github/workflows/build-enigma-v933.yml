name: Build Enigma V9.3.3

on:
  push:
    branches:
      - enigma-v9-3-window-narrative
    paths:
      - .github/workflows/build-enigma-v933.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enigma-v9-3-window-narrative
          fetch-depth: 0

      - name: Build corrected full strategy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_3_2_Strict_Window_Sequence.pine')
          dst = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_3_3_Current_Window_Sequence.pine')
          text = src.read_text(encoding='utf-8')

          text = text.replace(
              'PO3 MMXM Enigma V9.3.2 Strict Window Sequence',
              'PO3 MMXM Enigma V9.3.3 Current Window Sequence',
              1,
          )
          text = text.replace('shorttitle = "PO3E932S"', 'shorttitle = "PO3E933S"', 1)

          helper_marker = '\nmoreExtreme(float candidateTop, float candidateBottom, float currentTop, float currentBottom, int direction) =>'
          helper = '''

          signalToStructurePreserveSource(target, signal, string reasonText) =>
              market.setStructure(
                   target,
                   signal.direction,
                   signal.family,
                   signal.top,
                   signal.bottom,
                   signal.top,
                   signal.bottom,
                   signal.invalidation,
                   signal.sourceBar,
                   signal.sourceTime,
                   signal.sourceWindow,
                   signal.parentId,
                   market.STATUS_CONFIRMED,
                   signal.ruleId,
                   reasonText
              )
              target.confirmBar := bar_index
              target.active := true
              0
          '''
          if helper_marker not in text:
              raise RuntimeError('helper insertion marker not found')
          text = text.replace(helper_marker, helper + helper_marker, 1)

          old_new_after = 'bool newAfterFoundation = strictFoundation.active and strictDirection == structuralDirection and not na(strictFoundationBar) and fpiEvent.sourceBar > strictFoundationBar'
          new_new_after = '''bool newAfterFoundation =
                   strictFoundation.active and
                   strictDirection == structuralDirection and
                   strictFoundation.sourceWindow == w and
                   not na(strictFoundationBar) and
                   strictFoundation.confirmBar == strictFoundationBar and
                   fpiEvent.sourceWindow == w and
                   fpiEvent.sourceBar > strictFoundationBar and
                   bar_index > strictFoundationBar'''
          if old_new_after not in text:
              raise RuntimeError('newAfterFoundation marker not found')
          text = text.replace(old_new_after, new_new_after, 1)

          old_foundation_gate = 'if laterThanJudas and currentWindow >= 0 and alignedFoundationNow.valid'
          new_foundation_gate = '''bool strictActiveOppositeJudas =
               tradeActive and
               tradeIsJudas and
               tradeDirection == -structuralDirection and
               (
                    structuralDirection == market.DIR_LONG ? strategy.position_size < 0 :
                    structuralDirection == market.DIR_SHORT ? strategy.position_size > 0 :
                    false
               )

          bool strictFoundationFromCurrentWindow =
               alignedFoundationNow.valid and
               alignedFoundationNow.sourceWindow == currentWindow

          if laterThanJudas and currentWindow >= 0 and strictActiveOppositeJudas and strictFoundationFromCurrentWindow'''
          if old_foundation_gate not in text:
              raise RuntimeError('strict foundation gate marker not found')
          text = text.replace(old_foundation_gate, new_foundation_gate, 1)

          old_store = 'signalToStructure(strictFoundation, alignedFoundationNow, currentWindow, "STRICT_WINDOW_FOUNDATION_CONFIRMED")'
          new_store = 'signalToStructurePreserveSource(strictFoundation, alignedFoundationNow, "STRICT_WINDOW_FOUNDATION_CONFIRMED")'
          if old_store not in text:
              raise RuntimeError('strict foundation store marker not found')
          text = text.replace(old_store, new_store, 1)

          old_relabel = '''        strictFoundation.parentId := strictFoundation.sourceBar
                  strictFoundation.sourceWindow := currentWindow'''
          new_relabel = '''        strictFoundation.parentId := strictFoundation.sourceBar
                  // Do not relabel an older structure as a current-window foundation.
                  // sourceWindow remains the original detection window.'''
          if old_relabel not in text:
              # Handle the compact indentation used by the checked-in source.
              old_relabel = '''        strictFoundation.parentId := strictFoundation.sourceBar
                  strictFoundation.sourceWindow := currentWindow'''.replace('                  ', '        ')
              new_relabel = '''        strictFoundation.parentId := strictFoundation.sourceBar
                  // Do not relabel an older structure as a current-window foundation.
                  // sourceWindow remains the original detection window.'''.replace('                  ', '        ')
          if old_relabel not in text:
              raise RuntimeError('sourceWindow relabel marker not found')
          text = text.replace(old_relabel, new_relabel, 1)

          strict_pattern = re.compile(
              r'(?m)^(\s*)strictSequenceReady\s*=\s*strictFoundation\.active.*$'
          )
          match = strict_pattern.search(text)
          if not match:
              raise RuntimeError('strictSequenceReady assignment not found')
          indent = match.group(1)
          strict_block = f'''{indent}bool strictFoundationFamilyAllowed =
          {indent}     strictFoundation.family == market.FAMILY_PRIMARY_OB or
          {indent}     strictFoundation.family == market.FAMILY_BGOB
          {indent}
          {indent}strictSequenceReady =
          {indent}     strictActiveOppositeJudas and
          {indent}     strictFoundationFamilyAllowed and
          {indent}     strictFoundation.active and
          {indent}     strictSupport.active and
          {indent}     strictFoundation.status == market.STATUS_CONFIRMED and
          {indent}     strictSupport.status == market.STATUS_CONFIRMED and
          {indent}     strictDirection == structuralDirection and
          {indent}     strictFoundation.sourceWindow == currentWindow and
          {indent}     strictSupport.sourceWindow == currentWindow and
          {indent}     strictSupport.parentId == strictFoundation.sourceBar and
          {indent}     strictFoundation.confirmBar == strictFoundationBar and
          {indent}     strictSupport.sourceBar > strictFoundation.confirmBar and
          {indent}     strictSupport.breakBar >= strictSupport.sourceBar and
          {indent}     strictSupport.confirmBar > strictSupport.breakBar and
          {indent}     strictSupportConfirmBar == bar_index and
          {indent}     currentAuthority == structuralDirection'''
          text = strict_pattern.sub(strict_block, text, count=1)

          # A JUDAS-END signal is a reversal transaction, never a fresh flat entry.
          old_selection = '''if judasReversalSignal.valid
              selectedSignal := market.copySignal(judasReversalSignal)'''
          new_selection = '''if judasReversalSignal.valid and strictActiveOppositeJudas
              selectedSignal := market.copySignal(judasReversalSignal)'''
          if old_selection not in text:
              raise RuntimeError('selection marker not found')
          text = text.replace(old_selection, new_selection, 1)

          # Diagnostics make the source-window gate visible in TradingView's Data Window.
          diag_marker = 'plot(currentWindow >= 0 ? array.get(reversalFoundationBar, currentWindow) : na, "Strict Foundation Confirm Bar", display = display.data_window)'
          diag_insert = '''plot(currentWindow >= 0 ? array.get(reversalFoundationBar, currentWindow) : na, "Strict Foundation Confirm Bar", display = display.data_window)
          plot(currentWindow >= 0 and array.get(reversalFoundation, currentWindow).active ? array.get(reversalFoundation, currentWindow).sourceWindow : na, "Strict Foundation Source Window", display = display.data_window)
          plot(currentWindow >= 0 and array.get(reversalSupport, currentWindow).active ? array.get(reversalSupport, currentWindow).sourceWindow : na, "Strict IMB Source Window", display = display.data_window)'''
          if diag_marker not in text:
              raise RuntimeError('diagnostic marker not found')
          text = text.replace(diag_marker, diag_insert, 1)

          required = [
              'shorttitle = "PO3E933S"',
              'strictFoundationFromCurrentWindow',
              'alignedFoundationNow.sourceWindow == currentWindow',
              'signalToStructurePreserveSource',
              'strictSupport.sourceBar > strictFoundation.confirmBar',
              'strictActiveOppositeJudas',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise RuntimeError(f'missing required patches: {missing}')

          dst.write_text(text, encoding='utf-8')
          print(f'wrote {dst} with {len(text.splitlines())} lines')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enigma/PO3_MMXM_Enigma_Strategy_V9_3_3_Current_Window_Sequence.pine
          git commit -m "Add V9.3.3 current-window strict reversal fix"
          git push origin HEAD:enigma-v9-3-window-narrative
