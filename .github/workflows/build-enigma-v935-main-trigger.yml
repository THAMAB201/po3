name: Generate Enigma V9.3.5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-enigma-v935-main-trigger.yml
  pull_request:
    types:
      - opened

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout strategy branch
        uses: actions/checkout@v4
        with:
          ref: enigma-v9-3-window-narrative
          fetch-depth: 0

      - name: Generate corrected full strategy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_3_4_BOLO_IMB_Window_Handoff.pine')
          target = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_3_5_Strict_Window_Provenance.pine')
          branch_workflow = Path('.github/workflows/build-enigma-v935.yml')
          text = source.read_text(encoding='utf-8')

          replacements = []
          replacements.append((
              '"PO3 MMXM Enigma V9.3.4 BOLO IMB Window Handoff",\n    shorttitle = "PO3E934H",',
              '"PO3 MMXM Enigma V9.3.5 Strict Window Provenance",\n    shorttitle = "PO3E935W",'
          ))
          replacements.append((
              'minuteValue(int h, int m) => h * 60 + m\namStart() => minuteValue(amStartHour, amStartMinute)',
              'minuteValue(int h, int m) => h * 60 + m\nminuteFromTimestamp(int timestampValue) => na(timestampValue) ? -1 : hour(timestampValue, "America/New_York") * 60 + minute(timestampValue, "America/New_York")\nactualWindowFromTimestamp(int timestampValue) => market.windowFromMinute(minuteFromTimestamp(timestampValue))\namStart() => minuteValue(amStartHour, amStartMinute)'
          ))
          replacements.append((
              'bool relationshipValid = structure.active and foundation.active and structure.direction == targetDirection and foundation.direction == targetDirection and structure.sourceWindow == requiredWindow and foundation.sourceWindow == requiredWindow and structure.parentId == foundation.sourceBar and not na(structure.breakBar) and structure.breakBar >= foundationConfirmBar and bar_index > structure.breakBar',
              'bool relationshipValid = structure.active and foundation.active and structure.direction == targetDirection and foundation.direction == targetDirection and structure.sourceWindow == requiredWindow and foundation.sourceWindow == requiredWindow and actualWindowFromTimestamp(structure.sourceTime) == requiredWindow and actualWindowFromTimestamp(foundation.sourceTime) == requiredWindow and structure.parentId == foundation.sourceBar and structure.sourceBar > foundationConfirmBar and not na(structure.breakBar) and structure.breakBar > foundationConfirmBar and bar_index > structure.breakBar'
          ))
          replacements.append((
              '''        if enableBolo
            boloSeed = market.detectBoloObSeed(fpiEvent.direction, obSearchBars, w)
            if boloSeed.active
                targetBolo = fpiEvent.direction == market.DIR_LONG ? array.get(windowBullBolo, w) : array.get(windowBearBolo, w)
                if armMoreExtreme(targetBolo, boloSeed, fpiEvent.direction) and drawStructureBoxes
                    box boloBox = newZone(boloSeed.sourceTime, time + (market.periodEndMinute(w) - nowMinute) * 60000, boloSeed.top, boloSeed.bottom, fpiEvent.direction, fpiEvent.direction == market.DIR_LONG ? "Bullish BOLO OB" : "Bearish BOLO OB", zoneTransparency)
                    array.push(drawings, boloBox)''',
              '''        if enableBolo
            boloSeed = market.detectBoloObSeed(fpiEvent.direction, obSearchBars, w)
            int boloActualWindow = boloSeed.active ? actualWindowFromTimestamp(boloSeed.sourceTime) : -1
            int boloActualSession = boloSeed.active ? sessionId(minuteFromTimestamp(boloSeed.sourceTime)) : -1
            bool boloSourceProvenanceValid = boloSeed.active and boloActualWindow == w and boloActualSession == currentSession
            if boloSourceProvenanceValid
                boloSeed.sourceWindow := boloActualWindow
                targetBolo = fpiEvent.direction == market.DIR_LONG ? array.get(windowBullBolo, w) : array.get(windowBearBolo, w)
                if armMoreExtreme(targetBolo, boloSeed, fpiEvent.direction) and drawStructureBoxes
                    box boloBox = newZone(boloSeed.sourceTime, time + (market.periodEndMinute(w) - nowMinute) * 60000, boloSeed.top, boloSeed.bottom, fpiEvent.direction, fpiEvent.direction == market.DIR_LONG ? "Bullish BOLO OB" : "Bearish BOLO OB", zoneTransparency)
                    array.push(drawings, boloBox)'''
          ))
          replacements.append((
              'bool currentSourceWindow = alignedBoloNow.sourceWindow == currentWindow',
              'bool currentSourceWindow = alignedBoloNow.sourceWindow == currentWindow and actualWindowFromTimestamp(alignedBoloNow.sourceTime) == currentWindow'
          ))
          replacements.append((
              '''if laterThanJudas and eligibleFpi and fpiEvent.sourceWindow == currentWindow and fpiEvent.direction == structuralDirection
    strictFoundation = array.get(reversalFoundation, currentWindow)
    int strictFoundationConfirmBar = array.get(reversalFoundationBar, currentWindow)
    int strictDirection = array.get(reversalDirection, currentWindow)
    bool foundationReady = strictFoundation.active and strictFoundation.sourceWindow == currentWindow and strictDirection == structuralDirection and not na(strictFoundationConfirmBar)
    bool fpiBelongsToFoundation = foundationReady and fpiEvent.sourceBar >= strictFoundation.sourceBar and bar_index >= strictFoundationConfirmBar
    if enableImb and fpiBelongsToFoundation''',
              '''int strictFpiFirstWindow = eligibleFpi ? market.windowFromMinute(firstFpiMinute) : -1
int strictFpiMiddleWindow = eligibleFpi ? market.windowFromMinute(fpiEvent.middleMinute) : -1
int strictFpiThirdWindow = eligibleFpi ? currentWindow : -1
bool strictFpiWhollyCurrentWindow = eligibleFpi and strictFpiFirstWindow == currentWindow and strictFpiMiddleWindow == currentWindow and strictFpiThirdWindow == currentWindow

if laterThanJudas and strictFpiWhollyCurrentWindow and fpiEvent.direction == structuralDirection
    strictFoundation = array.get(reversalFoundation, currentWindow)
    int strictFoundationConfirmBar = array.get(reversalFoundationBar, currentWindow)
    int strictDirection = array.get(reversalDirection, currentWindow)
    bool foundationReady = strictFoundation.active and strictFoundation.sourceWindow == currentWindow and actualWindowFromTimestamp(strictFoundation.sourceTime) == currentWindow and strictDirection == structuralDirection and not na(strictFoundationConfirmBar)
    bool fpiBelongsToFoundation = foundationReady and fpiEvent.sourceBar > strictFoundationConfirmBar and bar_index > strictFoundationConfirmBar
    if enableImb and fpiBelongsToFoundation'''
          ))
          replacements.append((
              'strictSupport.parentId == strictFoundation.sourceBar and strictSupport.breakBar >= strictFoundationConfirmBar and strictSupport.confirmBar > strictSupport.breakBar and strictSupportConfirmBar == bar_index',
              'strictSupport.parentId == strictFoundation.sourceBar and strictSupport.sourceBar > strictFoundationConfirmBar and actualWindowFromTimestamp(strictSupport.sourceTime) == currentWindow and strictSupport.breakBar > strictFoundationConfirmBar and strictSupport.confirmBar > strictSupport.breakBar and strictSupportConfirmBar == bar_index'
          ))
          replacements.append((
              '"CURRENT_WINDOW_BOLO_THEN_SAME_DIRECTION_IMB_RETEST_RESPECT"',
              '"ACTUAL_CURRENT_WINDOW_BOLO_THEN_NEW_IMB_RETEST_RESPECT"'
          ))

          for old, new in replacements:
              if old not in text:
                  raise RuntimeError('Patch anchor not found:\n' + old[:180])
              text = text.replace(old, new, 1)

          required = [
              'shorttitle = "PO3E935W"',
              'boloSourceProvenanceValid',
              'strictFpiWhollyCurrentWindow',
              'fpiEvent.sourceBar > strictFoundationConfirmBar',
              'strictSupport.sourceBar > strictFoundationConfirmBar'
          ]
          for item in required:
              if item not in text:
                  raise RuntimeError('Missing required patch: ' + item)

          target.write_text(text, encoding='utf-8')
          if branch_workflow.exists():
              branch_workflow.unlink()
          PY

      - name: Commit strategy branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add V9.3.5 strict window provenance and post-BOLO IMB sequence"
          git push origin HEAD:enigma-v9-3-window-narrative

      - name: Remove temporary main workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          rm -f .github/workflows/build-enigma-v935-main-trigger.yml
          git add -A
          git commit -m "Remove temporary V9.3.5 generator workflow"
          git push origin HEAD:main
