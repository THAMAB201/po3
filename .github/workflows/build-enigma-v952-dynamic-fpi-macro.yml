name: Build Enigma V9.5.2 Dynamic FPI Macro

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/triggers/build-enigma-v952.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout strategy branch
        uses: actions/checkout@v4
        with:
          ref: enigma-v9-3-window-narrative
          fetch-depth: 0

      - name: Run V9.5.2 builder from main
        shell: bash
        run: |
          git show origin/main:.github/scripts/build_enigma_v952.py > /tmp/build_enigma_v952.py
          python /tmp/build_enigma_v952.py

      - name: Commit full strategy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enigma/PO3_MMXM_Enigma_Strategy_V9_5_2_Dynamic_Session_Macro_Roles.pine
          git commit -m "Add V9.5.2 dynamic Session and Macro FPI roles"
          git push origin HEAD:enigma-v9-3-window-narrative
