name: Build Enigma V9.5.2 Dynamic FPI Macro

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/triggers/build-enigma-v952.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout strategy branch
        uses: actions/checkout@v4
        with:
          ref: enigma-v9-3-window-narrative
          fetch-depth: 0

      - name: Run V9.5.2 builder from main
        shell: bash
        run: |
          git show origin/main:.github/scripts/build_enigma_v952.py > /tmp/build_enigma_v952.py
          python /tmp/build_enigma_v952.py

      - name: Upload full strategy atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          file_path = Path('enigma/PO3_MMXM_Enigma_Strategy_V9_5_2_Dynamic_Session_Macro_Roles.pine')
          api_url = 'https://api.github.com/repos/THAMAB201/po3/contents/' + str(file_path)
          payload = {
              'message': 'Add V9.5.2 dynamic Session and Macro FPI roles',
              'content': base64.b64encode(file_path.read_bytes()).decode('ascii'),
              'branch': 'enigma-v9-3-window-narrative',
          }
          request = urllib.request.Request(
              api_url,
              data=json.dumps(payload).encode('utf-8'),
              method='PUT',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status not in (200, 201):
                  raise RuntimeError(f'GitHub upload failed: {response.status}')
          PY
